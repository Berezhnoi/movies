services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - ./migrations:/migrations
    # Default run applies pending migrations; `make migrate-*` overrides the command.
    command: ["-path=/migrations", "-database", "${DATABASE_URL}", "up"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"

  # Used by app1/app2 and by the Redis tests (TEST_REDIS_URL=redis://127.0.0.1:6379).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The services below run only with `docker compose --profile scale up --build`.
  # Seeds the first admin once (it is idempotent) after the shared `migrate` run.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [scale]
    restart: "no"
    entrypoint: ["/usr/local/bin/movies-seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432

  app1: &scale-app
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [scale]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    env_file:
      - .env # Both instances share JWT_SECRET, so a token from one works on the other.
    environment:
      DB_HOST: db
      DB_PORT: 5432
      APP_PORT: 8080
      REDIS_URL: redis://redis:6379
      WS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8082
    ports:
      - "8081:8080"

  app2:
    <<: *scale-app
    ports:
      - "8082:8080"

volumes:
  postgres_data:
  pgadmin_data:
