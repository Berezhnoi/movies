name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt
        id: gofmt
        continue-on-error: true
        run: |
          files="$(git ls-files '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(gofmt -l $files)"
            if [ -n "$unformatted" ]; then
              echo "These files are not formatted, run gofmt -w:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: go vet
        id: vet
        continue-on-error: true
        run: go vet ./...

      - name: Tests
        id: tests
        continue-on-error: true
        run: go test -race -count=1 -timeout 180s ./...

      - name: Result
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.gofmt.outcome }}" != "success" ] || [ "${{ steps.vet.outcome }}" != "success" ]; then
            echo "Some checks failed, see the gofmt, go vet and Tests steps for details."
            exit 1
          fi
