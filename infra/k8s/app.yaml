apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-api
  namespace: movies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movies-api
  template:
    metadata:
      labels:
        app: movies-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: movies-api:lab
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            # Includes the trailer settings (TRAILERS_ENABLED, S3_ENDPOINT_URL, S3_BUCKET, AWS_*).
            - configMapRef: { name: movies-config }
            # WEBHOOK_URL comes from the Terraform output (make -C infra k8s-webhook).
            - configMapRef: { name: movies-webhook }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: movies-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: movies-secrets, key: JWT_SECRET } }
            - name: WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: movies-secrets, key: WEBHOOK_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Trailer uploads spool to a temp file; the root filesystem is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: movies-api
  namespace: movies
spec:
  type: NodePort
  selector:
    app: movies-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
