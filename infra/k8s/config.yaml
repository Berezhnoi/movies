# Non-secret settings. Secrets (DB_PASSWORD, JWT_SECRET, WEBHOOK_SECRET, ADMIN_PASSWORD)
# live in the movies-secrets Secret, created by `make -C infra k8s-secrets` from infra/secrets.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: movies-config
  namespace: movies
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: movies
  DB_NAME: movies
  DB_SSLMODE: disable
  APP_PORT: "8080"
  WEB_UI_ENABLED: "true"
  COOKIE_SECURE: "false"
  ADMIN_EMAIL: admin@movies.local
  # First Lambda invoke pulls the runtime image (~25s cold start on Floci).
  WEBHOOK_TIMEOUT: 60s
  # Trailers on Floci (outside the cluster). The CoreDNS floci zone (k8s-dns) resolves
  # `floci` to the node IP, where Floci publishes 4566. Dummy keys; Floci ignores them.
  TRAILERS_ENABLED: "true"
  S3_ENDPOINT_URL: http://floci:4566
  S3_BUCKET: trailers
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
